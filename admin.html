<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HAGE Institute Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--n:#071426;--n2:#0d1d34;--g:#d7ad55;--t:#eef3f8;--m:#a9b5c5;--l:#263852}*{box-sizing:border-box}body{margin:0;background:var(--n);color:var(--t);font:15px system-ui,Arial}.card{background:var(--n2);border:1px solid var(--l);border-radius:15px;padding:20px}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login .card{width:min(420px,100%);text-align:center}input,select,textarea{width:100%;padding:11px;margin:6px 0 12px;background:#08172a;color:var(--t);border:1px solid var(--l);border-radius:8px}label{display:block;text-align:left;color:var(--m);font-size:13px}.btn{border:0;border-radius:8px;padding:10px 14px;background:var(--g);font-weight:700;cursor:pointer}.dark{background:#182a44;color:var(--t);border:1px solid var(--l)}.red{background:#7a3038;color:white}.full{width:100%}.hide{display:none}.msg{padding:10px;margin-top:10px;border-radius:8px;background:#55252b}.ok{background:#194532}.head{position:sticky;top:0;background:#08172a;border-bottom:1px solid var(--l);z-index:2}.top,.nav,main{max-width:1200px;margin:auto;padding:14px 18px}.top{display:flex;justify-content:space-between;gap:10px}.top h2{margin:0;font-size:19px}.top small{color:var(--m)}.nav{display:flex;gap:7px;overflow:auto}.tab{white-space:nowrap;background:#142640;color:var(--m);border:1px solid var(--l);padding:9px 12px;border-radius:8px;cursor:pointer}.active{background:var(--g);color:#17120a}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat b{display:block;font-size:28px}.muted{color:var(--m)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.table{overflow:auto;margin-top:15px}table{width:100%;border-collapse:collapse;min-width:650px}th,td{padding:10px;border-bottom:1px solid var(--l);text-align:left}th{color:var(--g)}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body>
<section id="login" class="login"><div class="card"><img src="logo.jpg" style="width:78px;height:78px;border-radius:50%;object-fit:contain;background:white" onerror="this.style.display='none'"><h2>HAGE INSTITUTE FOR QUR'AN AL-KARIM</h2><p class="muted">Secure Administrator Login</p><form id="lf"><label>Email</label><input id="email" type="email" required autocomplete="username"><label>Password</label><input id="pass" type="password" required autocomplete="current-password"><button class="btn full">Sign in</button><div id="lm"></div></form></div></section>
<section id="app" class="hide"><header class="head"><div class="top"><div><h2>HAGE Institute — Admin Dashboard</h2><small id="who"></small></div><div><button class="btn dark" onclick="location.href='./index.html'">Website</button> <button id="out" class="btn red">Logout</button></div></div><nav id="nav" class="nav"></nav></header><main><div id="content"></div></main></section>
<script>
const URL='https://yzewhtjosyfrbgqhbzbu.supabase.co',KEY='sb_publishable_LvvJKJwC4z5p8DX7IkJeqA_M_-8LdEO';const db=supabase.createClient(URL,KEY);let tab='dashboard',edit=null;
const C={students:{n:'Students',f:[['name','Name','text'],['course','Course','text'],['status','Status','select','Active,Inactive,Completed']]},courses:{n:'Courses',f:[['name','Course name','text'],['type','Type','text'],['status','Status','select','Active,Inactive']]},teachers:{n:'Teachers',f:[['name','Teacher name','text'],['specialization','Specialization','text'],['status','Status','select','Active,Inactive']]},enrollments:{n:'Enrollments',f:[['name','Name','text'],['course','Course','text'],['contact','Contact','text'],['status','Status','select','Pending,Approved,Rejected']]},schedules:{n:'Schedules',f:[['course','Course','text'],['day','Day','text'],['time_text','Time','text'],['mode','Mode','select','Online,In-person']]},progress:{n:'Progress',f:[['student_id','Student ID','number'],['course','Course','text'],['progress_percent','Progress %','number']]},messages:{n:'Messages',f:[['name','Name','text'],['contact','Contact','text'],['message','Message','textarea'],['status','Status','select','Unread,Read']]}};
const $=x=>document.getElementById(x), esc=x=>String(x??'').replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]));
function msg(id,t,ok=false){$(id).innerHTML='<div class="msg '+(ok?'ok':'')+'>'+esc(t)+'</div>'}
async function admin(){let {data:{user}}=await db.auth.getUser();if(!user)return false;let {data,error}=await db.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();if(error||!data){await db.auth.signOut();msg('lm','This account is not authorized as a HAGE administrator.');return false}$('who').textContent=user.email||'';return true}
function nav(){ $('nav').innerHTML='<button class="tab" data-t="dashboard">Dashboard</button>'+Object.entries(C).map(([k,v])=>`<button class="tab" data-t="${k}">${v.n}</button>`).join('');document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;edit=null;nav();render()});document.querySelector(`[data-t="${tab}"]`).classList.add('active') }
async function render(){if(tab==='dashboard'){ $('content').innerHTML='<div class="stats">'+['students','courses','enrollments','messages'].map((x,i)=>`<div class="card"><b id="s${i}">…</b><span class="muted">${C[x].n}</span></div>`).join('')+'</div><div class="card" style="margin-top:15px"><h3>Welcome</h3><p class="muted">Manage your institute data using the tabs above.</p></div>';Promise.all(['students','courses','enrollments','messages'].map(x=>db.from(x).select('*',{count:'exact',head:true}))).then(a=>a.forEach((r,i)=>$('s'+i).textContent=r.count??0));return}let c=C[tab];$('content').innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between"><h3>${c.n}</h3><button class="btn" id="add">+ Add</button></div><div id="form"></div><div id="list" class="muted">Loading…</div></div>`;$('add').onclick=()=>form();await list()}
function form(r={}){let c=C[tab];$('form').innerHTML=`<form id="df"><div class="grid">${c.f.map(f=>{let[k,n,t,o]=f;let v=r[k]??'';return `<div><label>${n}</label>${t==='select'?`<select id="f_${k}">${o.split(',').map(x=>`<option ${x===String(v)?'selected':''}>${x}</option>`).join('')}</select>`:t==='textarea'?`<textarea id="f_${k}">${esc(v)}</textarea>`:`<input id="f_${k}" type="${t}" value="${esc(v)}" required>`}</div>`}).join('')}</div><button class="btn">${edit?'Update':'Save'}</button> <button type="button" class="btn dark" id="cancel">Cancel</button><div id="fm"></div></form>`;$('cancel').onclick=()=>{$('form').innerHTML='';edit=null};$('df').onsubmit=save}
async function save(e){e.preventDefault();let p={};C[tab].f.forEach(f=>{let[k,,t]=f,v=$('f_'+k).value;p[k]=t==='number'?Number(v):v});let q=edit?await db.from(tab).update(p).eq('id',edit):await db.from(tab).insert(p);if(q.error){msg('fm',q.error.message);return}edit=null;$('form').innerHTML='';await list()}
async function list(){let c=C[tab],r=await db.from(tab).select('*').order('created_at',{ascending:false}).limit(100);if(r.error){$('list').innerHTML='<div class="msg">'+esc(r.error.message)+'</div>';return}if(!r.data.length){$('list').innerHTML='<p class="muted">No records yet.</p>';return}let cols=c.f.map(x=>x[0]);$('list').innerHTML='<div class="table"><table><thead><tr>'+cols.map(x=>'<th>'+esc(x.replaceAll('_',' '))+'</th>').join('')+'<th>Actions</th></tr></thead><tbody>'+r.data.map(x=>'<tr>'+cols.map(k=>'<td>'+esc(x[k])+'</td>').join('')+`<td><button class="btn dark" onclick="editRow(${x.id})">Edit</button> <button class="btn red" onclick="delRow(${x.id})">Delete</button></td></tr>`).join('')+'</tbody></table></div>';window.rows=r.data}
window.editRow=id=>{let r=window.rows.find(x=>x.id==id);edit=id;form(r);scrollTo({top:0,behavior:'smooth'})};window.delRow=async id=>{if(!confirm('Delete this record?'))return;let r=await db.from(tab).delete().eq('id',id);if(r.error)alert(r.error.message);else list()};
$('lf').onsubmit=async e=>{e.preventDefault();$('lm').innerHTML='';let r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('pass').value});if(r.error){msg('lm',r.error.message);return}if(await admin()){$('login').classList.add('hide');$('app').classList.remove('hide');nav();render()}};$('out').onclick=async()=>{await db.auth.signOut();location.reload()};
(async()=>{let r=await db.auth.getSession();if(r.data.session&&await admin()){$('login').classList.add('hide');$('app').classList.remove('hide');nav();render()}})();
</script></body></html>
