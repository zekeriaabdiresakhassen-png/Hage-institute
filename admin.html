<!doctype html><html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HAGE Institute Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{font-family:Arial;background:#071426;color:white;margin:0;padding:12px}.wrap{max-width:1100px;margin:auto}
.card{background:#10223b;padding:18px;border-radius:14px;margin:12px 0}h1,h2{color:#d7ad55}
input,select,button{width:100%;padding:12px;margin:5px 0;border-radius:8px;border:1px solid #52657f;font:inherit}
input,select{background:white;color:#111}button{background:#d7ad55;color:#111;border:0;font-weight:bold}.danger{background:#9d3c3c;color:white;width:auto;padding:7px}
.hidden{display:none}.error{background:#5b2020;padding:10px;border-radius:8px}.ok{background:#174b31;padding:10px;border-radius:8px}
.nav{display:flex;gap:6px;overflow:auto}.nav button{width:auto;white-space:nowrap}.panel{display:none}.panel.active{display:block}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.stat{background:#172d49;padding:16px;border-radius:10px}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{padding:9px;border-bottom:1px solid #29415f;text-align:left}th{color:#d7ad55}.scroll{overflow-x:auto}
</style></head><body><div class="wrap">

<div id="login" class="card"><h1>HAGE Institute Admin</h1>
<input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password">
<button id="loginBtn">Sign in</button><div id="loginMsg"></div></div>

<div id="app" class="hidden">
<div class="card"><h1>Admin Dashboard</h1><p id="userEmail"></p><button id="logout">Log out</button><div id="msg"></div></div>
<div class="grid">
<div class="stat">Students<br><b id="studentsCount">0</b></div><div class="stat">Courses<br><b id="coursesCount">0</b></div>
<div class="stat">Teachers<br><b id="teachersCount">0</b></div><div class="stat">Enrollments<br><b id="enrollmentsCount">0</b></div></div>

<div class="card"><div class="nav">
<button onclick="panel('students')">Students</button><button onclick="panel('courses')">Courses</button>
<button onclick="panel('teachers')">Teachers</button><button onclick="panel('enrollments')">Enrollments</button>
<button onclick="panel('schedules')">Schedules</button><button onclick="panel('progress')">Progress</button><button onclick="panel('messages')">Messages</button>
</div></div>

<section id="students" class="card panel"><h2>Students</h2><form id="studentForm"><div class="row">
<input id="sn" placeholder="Student name" required><input id="sc" placeholder="Course" required>
<select id="ss"><option>Active</option><option>Inactive</option></select></div><button>Add Student</button></form>
<div class="scroll"><table><tbody id="studentsBody"></tbody></table></div></section>

<section id="courses" class="card panel"><h2>Courses</h2><form id="courseForm"><div class="row">
<input id="cn" placeholder="Course name" required><input id="ct" placeholder="Type" required><select id="cs"><option>Active</option><option>Inactive</option></select>
</div><button>Add Course</button></form><div class="scroll"><table><tbody id="coursesBody"></tbody></table></div></section>

<section id="teachers" class="card panel"><h2>Teachers</h2><form id="teacherForm"><div class="row">
<input id="tn" placeholder="Teacher name" required><input id="ts" placeholder="Specialization"><select id="tstatus"><option>Active</option><option>Inactive</option></select>
</div><button>Add Teacher</button></form><div class="scroll"><table><tbody id="teachersBody"></tbody></table></div></section>

<section id="enrollments" class="card panel"><h2>Enrollments</h2><form id="enrollmentForm"><div class="row">
<input id="en" placeholder="Name" required><input id="ec" placeholder="Course" required><input id="ep" placeholder="Phone / WhatsApp">
<select id="es"><option>Pending</option><option>Approved</option><option>Rejected</option></select></div><button>Add Enrollment</button></form>
<div class="scroll"><table><tbody id="enrollmentsBody"></tbody></table></div></section>

<section id="schedules" class="card panel"><h2>Schedules</h2><form id="scheduleForm"><div class="row">
<input id="sco" placeholder="Course" required><input id="sd" placeholder="Day" required><input id="stime" placeholder="Time"><select id="sm"><option>Online</option><option>In person</option></select>
</div><button>Add Schedule</button></form><div class="scroll"><table><tbody id="schedulesBody"></tbody></table></div></section>

<section id="progress" class="card panel"><h2>Student Progress</h2><form id="progressForm"><div class="row">
<select id="ps" required><option value="">Select student</option></select><input id="pc" placeholder="Course" required><input id="pp" type="number" min="0" max="100" placeholder="Progress %" required>
</div><button>Add Progress</button></form><div class="scroll"><table><tbody id="progressBody"></tbody></table></div></section>

<section id="messages" class="card panel"><h2>Messages</h2><div class="scroll"><table><tbody id="messagesBody"></tbody></table></div></section>
</div></div>

<script>
const URL="https://yzewhtjosyfrbgqhbzbu.supabase.co",KEY="sb_publishable_LvvJKJwC4z5p8DX7IkJeqA_M_-8LdEO";
const db=supabase.createClient(URL,KEY);
const $=id=>document.getElementById(id);
const esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function notice(t,bad=false){$("msg").className=bad?"error":"ok";$("msg").textContent=t}
async function admin(u){let r=await db.from("admin_users").select("user_id").eq("user_id",u.id).maybeSingle();if(r.error)throw Error(r.error.message);if(!r.data)throw Error("This account is not a HAGE admin.")}
async function counts(){for(let n of ["students","courses","teachers","enrollments"]){let r=await db.from(n).select("*",{count:"exact",head:true});$(n+"Count").textContent=r.count??0}}
async function load(n){
let r=await db.from(n).select("*").order("id",{ascending:false});if(r.error){notice(n+": "+r.error.message,true);return}
let fields={students:["name","course","status"],courses:["name","type","status"],teachers:["name","specialization","status"],enrollments:["name","course","contact","status"],schedules:["course","day","time_text","mode"],messages:["name","contact","message","status"]}[n];
$(n+"Body").innerHTML="<tr>"+fields.map(x=>"<th>"+x+"</th>").join("")+"<th>Action</th></tr>"+r.data.map(x=>"<tr>"+fields.map(f=>"<td>"+esc(x[f])+"</td>").join("")+"<td><button class=danger onclick='del(""+n+"","+x.id+")'>Delete</button></td></tr>").join("");
}
async function del(n,id){if(!confirm("Delete this record?"))return;let r=await db.from(n).delete().eq("id",id);if(r.error)notice(r.error.message,true);else{notice("Deleted.");load(n);counts()}}
async function add(n,row,form){let r=await db.from(n).insert(row);if(r.error)notice(r.error.message,true);else{notice("Saved successfully.");form.reset();load(n);counts();if(n==="students")students()}}
async function students(){let r=await db.from("students").select("id,name").order("name");$("ps").innerHTML='<option value="">Select student</option>'+(r.data||[]).map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join("")}
async function loadProgress(){let r=await db.from("progress").select("id,course,progress_percent,student_id,students(name)").order("id",{ascending:false});if(r.error){notice(r.error.message,true);return}
$("progressBody").innerHTML="<tr><th>Student</th><th>Course</th><th>Progress</th><th>Action</th></tr>"+(r.data||[]).map(x=>"<tr><td>"+esc(x.students?.name)+"</td><td>"+esc(x.course)+"</td><td>"+x.progress_percent+"%</td><td><button class=danger onclick='del("progress","+x.id+")'>Delete</button></td></tr>").join("")}
function panel(n){document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));$(n).classList.add("active");if(n==="progress")loadProgress();else if(n==="messages")load("messages");else load(n)}
$("studentForm").onsubmit=e=>{e.preventDefault();add("students",{name:sn.value,course:sc.value,status:ss.value},e.target)}
$("courseForm").onsubmit=e=>{e.preventDefault();add("courses",{name:cn.value,type:ct.value,status:cs.value},e.target)}
$("teacherForm").onsubmit=e=>{e.preventDefault();add("teachers",{name:tn.value,specialization:ts.value,status:tstatus.value},e.target)}
$("enrollmentForm").onsubmit=e=>{e.preventDefault();add("enrollments",{name:en.value,course:ec.value,contact:ep.value,status:es.value},e.target)}
$("scheduleForm").onsubmit=e=>{e.preventDefault();add("schedules",{course:sco.value,day:sd.value,time_text:stime.value,mode:sm.value},e.target)}
$("progressForm").onsubmit=e=>{e.preventDefault();add("progress",{student_id:Number(ps.value),course:pc.value,progress_percent:Number(pp.value)},e.target)}
$("loginBtn").onclick=async()=>{try{let r=await db.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(r.error)throw r.error;await admin(r.data.user);$("login").classList.add("hidden");$("app").classList.remove("hidden");$("userEmail").textContent=r.data.user.email;await counts();await students();panel("students")}catch(e){$("loginMsg").className="error";$("loginMsg").textContent=e.message;await db.auth.signOut()}}
$("logout").onclick=()=>db.auth.signOut().then(()=>location.reload());
(async()=>{let r=await db.auth.getSession();if(r.data.session)try{await admin(r.data.session.user);$("login").classList.add("hidden");$("app").classList.remove("hidden");$("userEmail").textContent=r.data.session.user.email;await counts();await students();panel("students")}catch(e){await db.auth.signOut()}})();
</script></body></html>
