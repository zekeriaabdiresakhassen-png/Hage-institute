<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>HAGE Institute — Admin Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --navy:#0B1F3A;
  --navy-dark:#071528;
  --navy-light:#123E6A;
  --blue:#1D5A91;
  --gold:#D4AF37;
  --gold-light:#F0D77C;
  --white:#FFFFFF;
  --bg:#F5F7FA;
  --border:#DCE3EC;
  --text:#172033;
  --muted:#6B778C;
  --success:#18794E;
  --success-bg:#E8F6EF;
  --danger:#B42318;
  --danger-bg:#FDECEC;
  --shadow:0 8px 25px rgba(7,21,40,.08);
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:
    Inter,
    Arial,
    Helvetica,
    sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* =========================
   LOGIN
========================= */

.login-page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:
    radial-gradient(circle at top right, rgba(212,175,55,.15), transparent 30%),
    linear-gradient(135deg,var(--navy-dark),var(--navy));
}

.login-box{
  width:100%;
  max-width:430px;
  background:var(--white);
  border-radius:20px;
  padding:36px;
  box-shadow:0 25px 70px rgba(0,0,0,.25);
}

.logo-area{
  text-align:center;
  margin-bottom:28px;
}

.logo-circle{
  width:72px;
  height:72px;
  margin:0 auto 16px;
  border-radius:50%;
  background:var(--navy);
  border:4px solid var(--gold);
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--gold);
  font-size:25px;
  font-weight:800;
}

.logo-area h1{
  margin:0;
  color:var(--navy);
  font-size:25px;
}

.logo-area p{
  margin:7px 0 0;
  color:var(--muted);
  font-size:14px;
}

.form-group{
  margin-bottom:15px;
}

label{
  display:block;
  margin-bottom:7px;
  font-size:13px;
  font-weight:700;
  color:var(--navy);
}

input,
select,
textarea{
  width:100%;
  padding:12px 13px;
  border:1px solid var(--border);
  border-radius:9px;
  background:#fff;
  color:var(--text);
  font:inherit;
  outline:none;
  transition:.2s;
}

input:focus,
select:focus,
textarea:focus{
  border-color:var(--gold);
  box-shadow:0 0 0 3px rgba(212,175,55,.12);
}

button{
  font:inherit;
  cursor:pointer;
  border:0;
}

.login-button{
  width:100%;
  padding:13px;
  border-radius:9px;
  background:var(--navy);
  color:#fff;
  font-weight:700;
  margin-top:5px;
  transition:.2s;
}

.login-button:hover{
  background:var(--navy-light);
  transform:translateY(-1px);
}

.login-button:disabled{
  opacity:.65;
  cursor:not-allowed;
  transform:none;
}

/* =========================
   GENERAL
========================= */

.hidden{
  display:none !important;
}

.wrap{
  width:min(1250px,calc(100% - 30px));
  margin:auto;
}

.muted{
  color:var(--muted);
}

.card{
  background:#fff;
  border-radius:15px;
  box-shadow:var(--shadow);
  border:1px solid rgba(220,227,236,.8);
}

.error,
.ok{
  padding:11px 13px;
  border-radius:9px;
  margin-top:12px;
  font-size:14px;
}

.error{
  background:var(--danger-bg);
  color:var(--danger);
  border:1px solid #f5c2c0;
}

.ok{
  background:var(--success-bg);
  color:var(--success);
  border:1px solid #b9e3ce;
}

/* =========================
   TOP HEADER
========================= */

.dashboard-header{
  background:var(--navy);
  color:#fff;
  box-shadow:0 5px 20px rgba(7,21,40,.18);
}

.header-inner{
  width:min(1250px,calc(100% - 30px));
  margin:auto;
  min-height:82px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.brand-mark{
  width:46px;
  height:46px;
  border:2px solid var(--gold);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--gold);
  font-weight:800;
  font-size:16px;
}

.brand-text strong{
  display:block;
  font-size:17px;
}

.brand-text span{
  display:block;
  margin-top:2px;
  color:#B9C7D9;
  font-size:12px;
}

.header-right{
  display:flex;
  align-items:center;
  gap:12px;
}

.admin-email{
  color:#D7E0EC;
  font-size:13px;
}

.logout-button{
  padding:9px 15px;
  border-radius:8px;
  background:var(--gold);
  color:#111;
  font-weight:700;
}

.logout-button:hover{
  background:var(--gold-light);
}

/* =========================
   MAIN
========================= */

main{
  padding:28px 0 50px;
}

.page-title{
  margin-bottom:22px;
}

.page-title h1{
  margin:0;
  color:var(--navy);
  font-size:28px;
}

.page-title p{
  margin:6px 0 0;
  color:var(--muted);
}

/* =========================
   STATISTICS
========================= */

.stats-grid{
  display:grid;
  grid-template-columns:
    repeat(4,minmax(0,1fr));
  gap:15px;
  margin-bottom:22px;
}

.stat-card{
  background:#fff;
  border-radius:14px;
  padding:20px;
  border:1px solid var(--border);
  box-shadow:var(--shadow);
  position:relative;
  overflow:hidden;
}

.stat-card::before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:4px;
  background:var(--gold);
}

.stat-label{
  color:var(--muted);
  font-size:13px;
  font-weight:700;
}

.stat-number{
  color:var(--navy);
  font-size:30px;
  font-weight:800;
  margin-top:8px;
}

/* =========================
   NAVIGATION
========================= */

.navigation{
  padding:10px;
  margin-bottom:22px;
}

.nav{
  display:flex;
  gap:6px;
  overflow-x:auto;
  scrollbar-width:thin;
}

.nav button{
  flex:0 0 auto;
  padding:11px 15px;
  border-radius:9px;
  background:transparent;
  color:var(--navy);
  font-weight:700;
  white-space:nowrap;
  transition:.2s;
}

.nav button:hover{
  background:#EEF2F7;
}

.nav button.active{
  background:var(--navy);
  color:#fff;
  box-shadow:0 3px 8px rgba(11,31,58,.2);
}

/* =========================
   PANELS
========================= */

.panel{
  display:none;
  padding:22px;
}

.panel.active{
  display:block;
}

.panel
