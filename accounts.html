<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HAGE — Account Manager</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial,sans-serif;background:#071426;color:#fff;margin:0;padding:20px}
.wrap{max-width:1000px;margin:auto}.card{background:#10223b;padding:22px;border-radius:14px;margin:18px 0}
h1,h2{color:#d7ad55}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
input,select,button{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;border-radius:8px}
input,select{border:1px solid #52657f;background:#fff;color:#111}button{border:0;background:#d7ad55;font-weight:bold;cursor:pointer}
.error{background:#5b2020;padding:12px;border-radius:8px;white-space:pre-wrap}.ok{background:#174b31;padding:12px;border-radius:8px}
.small{color:#b9c4d3;font-size:13px}.row{background:#172d49;padding:12px;border-radius:9px;margin:8px 0}
.hidden{display:none}
</style></head>
<body><div class="wrap">
<div id="login" class="card"><h1>HAGE Account Manager</h1><p class="small">Sign in with your existing HAGE administrator account.</p>
<input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Admin password">
<button id="loginBtn">Sign in</button><div id="loginMsg"></div></div>

<div id="app" class="hidden">
<div class="card"><h1>Create User Account</h1>
<div class="grid">
<div><label>Username</label><input id="username" placeholder="e.g. ahmed01"></div>
<div><label>Password</label><input id="newPassword" type="password" placeholder="Minimum 8 characters"></div>
<div><label>Role</label><select id="role"><option value="student">Student</option><option value="teacher">Teacher</option><option value="parent">Parent</option></select></div>
<div><label>Display name</label><input id="displayName" placeholder="Full name"></div>
</div>
<div id="studentPick"><label>Student record</label><select id="studentId"></select></div>
<div id="teacherPick" class="hidden"><label>Teacher record</label><select id="teacherId"></select></div>
<div id="parentPick" class="hidden"><label>Child/children</label><div id="children"></div></div>
<button id="createBtn">Create Account</button><div id="createMsg"></div>
</div>

<div class="card"><h2>Existing Accounts</h2><div id="accounts">Loading...</div></div>
<div class="card"><button id="logout">Log out</button></div>
</div></div>
<script>
const URL="https://yzewhtjosyfrbgqhbzbu.supabase.co";
const KEY="sb_publishable_LvvJKJwC4z5p8DX7IkJeqA_M_-8LdEO";
const db=window.supabase.createClient(URL,KEY);
const $=id=>document.getElementById(id);
function message(el,text,good=false){el.className=good?"ok":"error";el.textContent=text}
async function adminCheck(){
 const {data:{session}}=await db.auth.getSession();
 if(!session) return false;
 const {data,error}=await db.from("admin_users").select("user_id").eq("user_id",session.user.id).maybeSingle();
 if(error||!data) return false;
 $("login").classList.add("hidden");$("app").classList.remove("hidden");
 await loadOptions();await loadAccounts();return true;
}
async function loadOptions(){
 const s=await db.from("students").select("id,name").order("name");
 const t=await db.from("teachers").select("id,name").order("name");
 if(s.error) throw s.error;if(t.error) throw t.error;
 $("studentId").innerHTML=s.data.map(x=>`<option value="${x.id}">${x.name} (#${x.id})</option>`).join("")||"<option value=''>No students</option>";
 $("teacherId").innerHTML=t.data.map(x=>`<option value="${x.id}">${x.name} (#${x.id})</option>`).join("")||"<option value=''>No teachers</option>";
 $("children").innerHTML=s.data.map(x=>`<label class="row"><input type="checkbox" value="${x.id}"> ${x.name} (#${x.id})</label>`).join("")||"No students";
}
async function loadAccounts(){
 const {data,error}=await db.from("user_profiles").select("username,role,display_name,active,created_at").order("created_at",{ascending:false});
 if(error){$("accounts").textContent=error.message;return}
 $("accounts").innerHTML=data.map(x=>`<div class="row"><b>${x.display_name}</b> — ${x.username}<br>Role: ${x.role} · ${x.active?"Active":"Inactive"}</div>`).join("")||"No accounts yet.";
}
$("role").onchange=()=>{const r=$("role").value;$("studentPick").classList.toggle("hidden",r!=="student");$("teacherPick").classList.toggle("hidden",r!=="teacher");$("parentPick").classList.toggle("hidden",r!=="parent")};
$("createBtn").onclick=async()=>{
 $("createMsg").className="";$("createMsg").textContent="";
 const {data:{session}}=await db.auth.getSession();
 if(!session){message($("createMsg"),"Admin session expired. Sign in again.");return}
 const role=$("role").value;
 const childIds=[...document.querySelectorAll("#children input:checked")].map(x=>Number(x.value));
 const body={username:$("username").value.trim().toLowerCase(),password:$("newPassword").value,role,display_name:$("displayName").value.trim(),
 student_id:role==="student"?Number($("studentId").value):null,teacher_id:role==="teacher"?Number($("teacherId").value):null,child_ids:role==="parent"?childIds:[]};
 try{
  const r=await fetch(URL+"/functions/v1/create-user",{method:"POST",headers:{"Authorization":"Bearer "+session.access_token,"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j=await r.json();if(!r.ok)throw new Error(j.error||"Account creation failed");
  message($("createMsg"),"Account created successfully: "+j.username,true);
  $("username").value="";$("newPassword").value="";$("displayName").value="";
  await loadAccounts();
 }catch(e){message($("createMsg"),e.message||String(e))}
};
$("loginBtn").onclick=async()=>{try{const r=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(r.error)throw r.error;if(!await adminCheck())throw new Error("This account is not a HAGE admin.");}catch(e){message($("loginMsg"),e.message||String(e))}};
$("logout").onclick=async()=>{await db.auth.signOut();location.reload()};
adminCheck().catch(e=>message($("loginMsg"),e.message||String(e)));
</script></body></html>
