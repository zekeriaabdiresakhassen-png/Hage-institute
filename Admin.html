<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HAGE Institute — Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial,sans-serif;background:#071426;color:#fff;margin:0;padding:20px}
.wrap{max-width:900px;margin:auto}.card{background:#10223b;padding:24px;border-radius:14px;margin:20px 0}
input,button{width:100%;padding:13px;margin:7px 0;border-radius:8px;border:1px solid #52657f;box-sizing:border-box}
input{background:#fff;color:#111}button{background:#d7ad55;color:#111;border:0;font-weight:bold;cursor:pointer}
.hidden{display:none}.error{background:#5b2020;padding:12px;border-radius:8px;margin-top:10px;white-space:pre-wrap}
.ok{background:#174b31;padding:12px;border-radius:8px;margin-top:10px}
h1{color:#d7ad55}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.stat{background:#172d49;padding:18px;border-radius:10px}
.small{color:#b9c4d3;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <div id="login" class="card">
    <h1>HAGE Institute Admin</h1>
    <p class="small">Sign in with the administrator account created in Supabase.</p>
    <input id="email" type="email" placeholder="Admin email" autocomplete="username">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">
    <button id="loginBtn">Sign in</button>
    <div id="loginMsg"></div>
  </div>

  <div id="dashboard" class="hidden">
    <div class="card">
      <h1>Admin Dashboard</h1>
      <p id="userEmail" class="small"></p>
      <button id="logoutBtn">Log out</button>
      <div id="dashMsg"></div>
    </div>
    <div class="grid">
      <div class="stat">Students<br><strong id="studentsCount">—</strong></div>
      <div class="stat">Courses<br><strong id="coursesCount">—</strong></div>
      <div class="stat">Teachers<br><strong id="teachersCount">—</strong></div>
      <div class="stat">Enrollments<br><strong id="enrollmentsCount">—</strong></div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://yzewhtjosyfrbgqhbzbu.supabase.co";
const SUPABASE_KEY = "sb_publishable_LvvJKJwC4z5p8DX7IkJeqA_M_-8LdEO";

const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const loginBox = document.getElementById("login");
const dashboard = document.getElementById("dashboard");
const loginMsg = document.getElementById("loginMsg");
const dashMsg = document.getElementById("dashMsg");

function showError(el, msg){ el.className="error"; el.textContent=msg; }
function showOk(el, msg){ el.className="ok"; el.textContent=msg; }

async function checkAdmin(user){
  const {data, error} = await client
    .from("admin_users")
    .select("user_id")
    .eq("user_id", user.id)
    .maybeSingle();

  if(error) throw new Error("Admin check failed: " + error.message);
  if(!data) throw new Error("This Supabase account is not registered as a HAGE admin.");
  return true;
}

async function loadCounts(){
  const tables = [
    ["students","studentsCount"],
    ["courses","coursesCount"],
    ["teachers","teachersCount"],
    ["enrollments","enrollmentsCount"]
  ];
  for(const [table,id] of tables){
    const {count,error} = await client.from(table).select("*",{count:"exact",head:true});
    if(error){
      document.getElementById(id).textContent="Error";
    }else{
      document.getElementById(id).textContent=count ?? 0;
    }
  }
}

async function openDashboard(user){
  await checkAdmin(user);
  loginBox.classList.add("hidden");
  dashboard.classList.remove("hidden");
  document.getElementById("userEmail").textContent = user.email || "";
  await loadCounts();
}

document.getElementById("loginBtn").addEventListener("click", async ()=>{
  loginMsg.className=""; loginMsg.textContent="";
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  if(!email || !password){
    showError(loginMsg,"Enter both your email and password.");
    return;
  }
  const btn=document.getElementById("loginBtn");
  btn.disabled=true; btn.textContent="Signing in...";
  try{
    const {data,error}=await client.auth.signInWithPassword({email,password});
    if(error) throw error;
    await openDashboard(data.user);
    showOk(dashMsg,"Signed in successfully.");
  }catch(e){
    await client.auth.signOut();
    showError(loginMsg,e.message || String(e));
  }finally{
    btn.disabled=false; btn.textContent="Sign in";
  }
});

document.getElementById("logoutBtn").addEventListener("click", async ()=>{
  await client.auth.signOut();
  dashboard.classList.add("hidden");
  loginBox.classList.remove("hidden");
  loginMsg.className=""; loginMsg.textContent="";
});

(async()=>{
  const {data:{session}} = await client.auth.getSession();
  if(session?.user){
    try{ await openDashboard(session.user); }
    catch(e){
      await client.auth.signOut();
      showError(loginMsg,e.message || String(e));
    }
  }
})();
</script>
</body>
</html>
